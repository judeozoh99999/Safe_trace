name: safetrace
description: "SafeTrace - Personal safety mobile application for Nigeria."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^14.2.0

  # Backend & Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  cloud_functions: ^5.0.1
  firebase_messaging: ^15.0.1
  firebase_storage: ^12.0.1

  # HTTP Client
  dio: ^5.5.0

  # Environment Variables
  flutter_dotenv: ^5.1.1

  # Maps & Location
  geolocator: ^12.0.0
  google_maps_flutter: ^2.6.2

  # Crash Reporting
  sentry_flutter: ^8.2.0

  # Machine Learning
  tflite_flutter: ^0.10.4

  # Fonts
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.9
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/ml/
